name: Build POLPICK GEM DETECTOR APK

'on':
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f POLPICK_GEM_DETECTOR_V2_SOURCE.zip
          mkdir -p appsrc
          unzip -q -o POLPICK_GEM_DETECTOR_V2_SOURCE.zip -d appsrc

      - name: Add MediaProjection foreground service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          base = Path("appsrc/app/src/main")
          manifest = base / "AndroidManifest.xml"
          text = manifest.read_text()
          if "ProjectionForegroundService" not in text:
              text = text.replace(
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>'
              )
              text = text.replace(
                  '    </application>',
                  '        <service android:name=".ProjectionForegroundService" '
                  'android:exported="false" android:foregroundServiceType="mediaProjection"/>\n'
                  '    </application>'
              )
              manifest.write_text(text)

          kt = base / "java/com/polpick/gemdetector"
          kt.mkdir(parents=True, exist_ok=True)
          activity = kt / "MainActivity.kt"
          src = activity.read_text()
          imports = "import android.content.ComponentName\nimport android.content.ServiceConnection\nimport android.os.IBinder\nimport android.os.Build\n"
          if "ProjectionForegroundService" not in src:
              src = src.replace("import android.content.Intent\n", "import android.content.Intent\n" + imports)
              src = src.replace(
                  "    private val captureRequest = 4102\n",
                  """    private val captureRequest = 4102
              private var captureService: ProjectionForegroundService? = null
              private var serviceBound = false
              private var pendingResultCode: Int? = null
              private var pendingProjectionData: Intent? = null
              private val captureServiceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      captureService = (binder as ProjectionForegroundgroundService.LocalBinder).getService()
                      waitForForegroundAndCapture(0)
                  }
                  private fun waitForForegroundAndCapture(attempt: Int) {
                      val service = captureService
                      val code = pendingResultCode
                      val data = pendingProjectionData
                      if (service == null || code == null || data == null) return
                      if (!service.isForegroundReady()) {
                          if (attempt < 30) {
                              handler.postDelayed({ waitForForegroundAndCapture(attempt + 1) }, 100)
                          } else {
                              status.text = "Le service de capture n'a pas confirmé son démarrage au premier plan. Réessaie."
                              stopProjection()
                          }
                          return
                      }
                      try {
                          projection = service.createProjection(code, data)
                          pendingResultCode = null
                          pendingProjectionData = null
                          captureOneFrame()
                      } catch (e: Exception) {
                          status.text = "Impossible de démarrer la capture : ${e.message ?: "erreur Android"}"
                          stopProjection()
                      }
                  }
                  override fun onServiceDisconnected(name: ComponentName?) {
                      captureService = null
                      serviceBound = false
                  }
              }
              """.replace("ProjectionForegroundgroundService", "ProjectionForegroundService")
              )
              old_result = """        try {
                      val manager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      projection = manager.getMediaProjection(resultCode, data)
                      captureOneFrame()
                  } catch (e: Exception) {
                      status.text = "Impossible de démarrer la capture : ${e.message ?: "erreur Android"}"
                      stopProjection()
                  }"""
              new_result = """        try {
                      pendingResultCode = resultCode
                      pendingProjectionData = data
                      val serviceIntent = Intent(this, ProjectionForegroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      serviceBound = bindService(serviceIntent, captureServiceConnection, Context.BIND_AUTO_CREATE)
                      if (!serviceBound) throw IllegalStateException("Impossible de connecter le service de capture")
                  } catch (e: Exception) {
                      status.text = "Impossible de démarrer le service de capture : ${e.message ?: "erreur Android"}"
                      stopProjection()
                  }"""
              if old_result not in src:
                  raise SystemExit("Could not locate onActivityResult capture block; refusing unsafe patch")
              src = src.replace(old_result, new_result)
              old_stop = """        projection?.stop()
                  projection = null
              }"""
              new_stop = """        projection?.stop()
                  projection = null
                  pendingProjectionData = null
                  pendingResultCode = null
                  if (serviceBound) {
                      try { unbindService(captureServiceConnection) } catch (_: Exception) {}
                      serviceBound = false
                  }
                  captureService = null
                  stopService(Intent(this, ProjectionForegroundService::class.java))
              }"""
              if old_stop not in src:
                  raise SystemExit("Could not locate stopProjection cleanup block")
              src = src.replace(old_stop, new_stop)
              activity.write_text(src)
          print("Foreground service and Activity handoff configured")
          PY

      - name: Start MediaProjection foreground service before binding
        shell: bash
        run: |
          set -euo pipefail
          cat > appsrc/app/src/main/java/com/polpick/gemdetector/ProjectionForegroundService.kt <<'EOF'
          package com.polpick.gemdetector

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Binder
          import android.os.Build
          import android.os.IBinder

          class ProjectionForegroundService : Service() {
              inner class LocalBinder : Binder() {
                  fun getService(): ProjectionForegroundService = this@ProjectionForegroundService
              }

              private val binder = LocalBinder()
              @Volatile private var foregroundReady = false

              fun isForegroundReady(): Boolean = foregroundReady

              fun createProjection(resultCode: Int, data: Intent): MediaProjection {
                  check(foregroundReady) { "Le service de capture n'est pas encore au premier plan" }
                  val manager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  return manager.getMediaProjection(resultCode, data)
                      ?: throw IllegalStateException("Android n'a pas créé la session de capture")
              }

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Capture d'écran",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                      .setContentTitle("POLPICK GEM DETECTOR")
                      .setContentText("Service de capture actif")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }
                  foregroundReady = true
                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder = binder

              override fun onDestroy() {
                  foregroundReady = false
                  stopForeground(true)
                  super.onDestroy()
              }

              companion object {
                  private const val CHANNEL_ID = "polpick_screen_capture"
                  private const val NOTIFICATION_ID = 4103
              }
          }
          EOF
      - name: Add runtime MediaProjection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          base = Path("appsrc/app/src/main/java/com/polpick/gemdetector")
          activity = base / "MainActivity.kt"
          service = base / "ProjectionForegroundService.kt"
          a = activity.read_text()
          s = service.read_text()

          # Add diagnostic logging using stable code tokens, not indentation-sensitive blocks.
          if "import android.util.Log" not in a:
              a = a.replace("package com.polpick.gemdetector\n",
                            "package com.polpick.gemdetector\n\nimport android.util.Log\n", 1)
          if "import android.util.Log" not in s:
              s = s.replace("package com.polpick.gemdetector\n",
                            "package com.polpick.gemdetector\n\nimport android.util.Log\n", 1)

          token = "projection = service.createProjection(code, data)"
          if token not in a:
              raise SystemExit("Cannot find getMediaProjection call in MainActivity; refusing build")
          a = a.replace(token,
              'Log.e("PGD_DIAG", "BEFORE getMediaProjection; SDK=" + Build.VERSION.SDK_INT + "; model=" + Build.MODEL)\n'
              + "                          " + token + "\n"
              + '                          Log.e("PGD_DIAG", "getMediaProjection SUCCESS")', 1)

          token = "foregroundReady = true"
          if token not in s:
              raise SystemExit("Cannot find foregroundReady marker in service; refusing build")
          s = s.replace(token,
              'Log.e("PGD_DIAG", "startForeground completed; SDK=" + Build.VERSION.SDK_INT)\n'
              + "                  " + token, 1)

          token = "override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {"
          if token not in s:
              raise SystemExit("Cannot find onStartCommand in service; refusing build")
          s = s.replace(token, token + '\n                  Log.e("PGD_DIAG", "onStartCommand entered; SDK=" + Build.VERSION.SDK_INT)', 1)

          activity.write_text(a)
          service.write_text(s)
          print("Runtime diagnostic markers inserted")
          PY

      - name: Inspect capture implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '===== ANDROID MANIFEST ====='
          cat appsrc/app/src/main/AndroidManifest.xml
          echo '===== MAIN ACTIVITY ====='
          cat appsrc/app/src/main/java/com/polpick/gemdetector/MainActivity.kt

      - name: Configure Gradle settings
        shell: bash
        run: |
          set -euo pipefail
          cat > appsrc/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PolpickGemDetector"
          include(":app")
          EOF

      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("appsrc/app")
          kts = app / "build.gradle.kts"
          groovy = app / "build.gradle"

          if kts.exists():
              p = kts
              addition = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          elif groovy.exists():
              p = groovy
              addition = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """
          else:
              raise SystemExit("Could not find app/build.gradle(.kts)")

          original = p.read_text()
          if "jvmTarget = \"17\"" not in original and "jvmTarget = '17'" not in original:
              p.write_text(original + addition)
          print(f"Java/Kotlin target configured in {p}")
          PY

      - name: Increment APK version code for diagnostic build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("appsrc/app/build.gradle.kts"), Path("appsrc/app/build.gradle")]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit("App Gradle file not found")
          content = path.read_text()
          pattern = r"(versionCode\s*(?:=\s*)?)(\d+)"
          matches = list(re.finditer(pattern, content))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one numeric versionCode, found {len(matches)}")
          old = int(matches[0].group(2))
          content = re.sub(pattern, lambda m: m.group(1) + str(old + 1), content, count=1)
          path.write_text(content)
          print(f"Diagnostic APK versionCode: {old} -> {old + 1}")
          PY

      - name: Build debug APK
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug

      - name: Verify APK identity and Android SDK settings
        shell: bash
        run: |
          set -euo pipefail
          echo '===== APP GRADLE CONFIG ====='
          sed -n '1,220p' appsrc/app/build.gradle* || true
          echo '===== APK PACKAGE AND SDK ====='
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging appsrc/app/build/outputs/apk/debug/app-debug.apk | head -n 8
          "$AAPT" dump xmltree appsrc/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -E 'uses-sdk|targetSdkVersion|minSdkVersion|foregroundServiceType|ProjectionForegroundService|FOREGROUND_SERVICE' || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: POLPICK-GEM-DETECTOR-debug-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
