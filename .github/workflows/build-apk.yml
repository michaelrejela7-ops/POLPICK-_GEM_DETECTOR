name: Build POLPICK GEM DETECTOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android source
        run: |
          mkdir appsrc
          unzip POLPICK_GEM_DETECTOR_V2_SOURCE.zip -d appsrc

      - name: Fix Android Gradle settings
        run: |
          cat > appsrc/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PolpickGemDetector"
          include(":app")
          EOF

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("appsrc/app")
          kts = app / "build.gradle.kts"
          groovy = app / "build.gradle"
          if kts.exists():
              p = kts
              addition = '''
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''
          elif groovy.exists():
              p = groovy
              addition = '''
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          '''
          else:
              raise SystemExit("Could not find app/build.gradle or app/build.gradle.kts")
          p.write_text(p.read_text() + addition)
          print("Aligned Java and Kotlin compilation targets to JVM 17 in", p)
          PY

      - name: Inspect capture implementation
        run: |
          echo '--- AndroidManifest.xml ---'
          cat appsrc/app/src/main/AndroidManifest.xml
          echo '--- MainActivity.kt ---'
          sed -n '1,280p' appsrc/app/src/main/java/com/polpick/gemdetector/MainActivity.kt

      - name: Build debug APK
        working-directory: appsrc
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POLPICK-GEM-DETECTOR-debug-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
