name: Build POLPICK GEM DETECTOR APK

'on':
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f POLPICK_GEM_DETECTOR_V2_SOURCE.zip
          mkdir -p appsrc
          unzip -q -o POLPICK_GEM_DETECTOR_V2_SOURCE.zip -d appsrc

      - name: Configure Gradle settings
        shell: bash
        run: |
          set -euo pipefail
          cat > appsrc/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PolpickGemDetector"
          include(":app")
          EOF

      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("appsrc/app")
          kts = app / "build.gradle.kts"
          groovy = app / "build.gradle"

          if kts.exists():
              p = kts
              addition = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          elif groovy.exists():
              p = groovy
              addition = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """
          else:
              raise SystemExit("Could not find app/build.gradle(.kts)")

          original = p.read_text()
          if "jvmTarget = \"17\"" not in original and "jvmTarget = '17'" not in original:
              p.write_text(original + addition)
          print(f"Java/Kotlin target configured in {p}")
          PY

      - name: Build debug APK
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: POLPICK-GEM-DETECTOR-debug-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
